<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spritpreis Tracker Österreich</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            font-size: 1.2rem;
        }

        .controls {
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input {
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            flex: 1;
            min-width: 120px;
        }

        button {
            padding: 8px 12px;
            background: #333;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            white-space: nowrap;
        }

        button.active {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }

        .station {
            background: #2a2a2a;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .station>div:first-child {
            min-width: 0;
            flex: 1;
        }

        .station>div:first-child>div:first-child {
            overflow-wrap: anywhere;
        }

        .station-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 4px;
        }

        .station-address {
            color: #aaa;
            font-size: 0.85em;
            line-height: 1.3;
            margin-bottom: 2px;
        }

        .station-city {
            color: #888;
            font-size: 0.85em;
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .fuel-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .fuel-label {
            font-size: 0.75em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .top-winner {
            border: 2px solid #ffcc00;
            background: #332a15;
        }

        .price {
            font-size: 1.4em;
            font-weight: bold;
            color: #00ffcc;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: right;
        }

        .top-winner .price {
            color: #ffcc00;
        }

        .star {
            color: #ffcc00;
            margin-right: 5px;
        }

        #loader {
            text-align: center;
            color: #aaa;
            margin-top: 20px;
        }

        .maps-link {
            display: inline-block;
            margin-top: 6px;
            color: #00ffcc;
            text-decoration: none;
            font-size: 0.85em;
            border: 1px solid #00ffcc;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .maps-link:hover {
            background: #00ffcc;
            color: #000;
        }

        .no-results {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .no-results-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #ff6666;
            margin-bottom: 8px;
        }

        .no-results-hint {
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 16px;
        }

        .no-results-suggestions {
            color: #ccc;
        }

        .suggestion-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .suggestion-buttons button {
            background: #333;
            border: 1px solid #555;
        }

        #searchQuery {
            font-size: 1.4rem;
        }

        @media (min-width: 601px) {
            body {
                padding: 20px;
            }


            button {
                font-size: xx-large;
                padding: 10px 15px;
            }

            .station {
                padding: 15px;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Spritpreise Österreich</h2>

        <div class="controls">
            <input type="text" id="searchQuery" placeholder="Ort oder PLZ (z.B. Hohenems)">
            <button id="btnSUP" class="active" onclick="changeFuel('SUP')">Super</button>
            <button id="btnDIE" onclick="changeFuel('DIE')">Diesel</button>
            <button onclick="search()">Suchen</button>
        </div>

        <div id="loader">Lade Preise...</div>
        <div id="stations"></div>
    </div>

    <script>
        let currentFuel = 'SUP';

        const savedCity = localStorage.getItem('sprit_saved_city') || '';
        document.getElementById('searchQuery').value = savedCity;
        if (!savedCity) {
            document.getElementById('loader').style.display = 'none';
        }

        function changeFuel(type) {
            currentFuel = type;
            document.getElementById('btnSUP').classList.toggle('active', type === 'SUP');
            document.getElementById('btnDIE').classList.toggle('active', type === 'DIE');
            search();
        }

        function search() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('stations').innerHTML = '<div>Bitte Ort oder PLZ eingeben.</div>';
                return;
            }
            localStorage.setItem('sprit_saved_city', query);

            document.getElementById('loader').style.display = 'block';
            document.getElementById('stations').innerHTML = '';

            fetch(`/api/prices?q=${encodeURIComponent(query)}&fuel=${currentFuel}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    const container = document.getElementById('stations');

                    if (data.length === 0) {
                        container.innerHTML = `
                            <div class="no-results">
                                <div class="no-results-title">Keine Tankstellen in „${query}" gefunden</div>
                                <div class="no-results-hint">Die E-Control API hat in diesem Ort aktuell keine Preisdaten.</div>
                                <div class="no-results-suggestions">
                                    <div>Probiere eine nahegelegene größere Stadt:</div>
                                    <div class="suggestion-buttons">
                                        <button onclick="quickSearch('Dornbirn')">Dornbirn</button>
                                        <button onclick="quickSearch('Bregenz')">Bregenz</button>
                                        <button onclick="quickSearch('Hohenems')">Hohenems</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    if (data.error) {
                        container.innerHTML = '<div class="no-results"><div class="no-results-title">Fehler bei der Suche</div><div class="no-results-hint">' + (data.error || 'Unbekannter Fehler') + '</div></div>';
                        return;
                    }

                    data.forEach(s => {
                        const div = document.createElement('div');
                        div.className = `station${s.is_top ? ' top-winner' : ''}`;
                        const mapsCity = (s.city || (s.address ? s.address.split(',').pop().trim() : '') || query);
                        const mapsQuery = encodeURIComponent(`${s.name} ${mapsCity}`.trim());
                        const streetLine = s.street || s.address || '';
                        const cityLine = s.city || query || '';
                        div.innerHTML = `
                            <div>
                                <div class="station-name">${s.is_top ? '<span class="star">★</span>' : ''}${s.name}</div>
                                ${streetLine ? `<div class="station-address">${streetLine}</div>` : ''}
                                ${cityLine ? `<div class="station-city">${cityLine}</div>` : ''}
                                <a class="maps-link" href="https://www.google.com/maps/search/?api=1&query=${mapsQuery}" target="_blank" rel="noopener noreferrer">📍 Karte</a>
                            </div>
                            <div class="fuel-info">
                                <div class="fuel-label">${s.fuel_label || ''}</div>
                                <div class="price">${s.price}</div>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                })
                .catch(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('stations').innerHTML = '<div>Fehler beim Laden der Preise.</div>';
                });
        }

        document.getElementById('searchQuery').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                search();
            }
        });

        function quickSearch(city) {
            document.getElementById('searchQuery').value = city;
            search();
        }

        if (savedCity) {
            search();
        }
    </script>
</body>

</html>
