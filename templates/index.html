<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spritpreis Tracker Österreich</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            font-size: 1.2rem;
        }

        .controls {
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input {
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            flex: 1;
            min-width: 120px;
        }

        button {
            padding: 8px 12px;
            background: #333;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            white-space: nowrap;
        }

        button.active {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }

        .station {
            background: #2a2a2a;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .station>div:first-child {
            min-width: 0;
            flex: 1;
        }

        .station>div:first-child>div:first-child {
            overflow-wrap: anywhere;
        }

        .top-winner {
            border: 2px solid #ffcc00;
            background: #332a15;
        }

        .price {
            font-size: 1.4em;
            font-weight: bold;
            color: #00ffcc;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: right;
        }

        .top-winner .price {
            color: #ffcc00;
        }

        .star {
            color: #ffcc00;
            margin-right: 5px;
        }

        #loader {
            text-align: center;
            color: #aaa;
            margin-top: 20px;
        }

        .maps-link {
            display: inline-block;
            margin-top: 6px;
            color: #00ffcc;
            text-decoration: none;
            font-size: 0.85em;
            border: 1px solid #00ffcc;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .maps-link:hover {
            background: #00ffcc;
            color: #000;
        }

        #searchQuery {
            font-size: 1.4rem;
        }

        @media (min-width: 601px) {
            body {
                padding: 20px;
            }


            button {
                font-size: xx-large;
                padding: 10px 15px;
            }

            .station {
                padding: 15px;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Spritpreise Österreich</h2>

        <div class="controls">
            <input type="text" id="searchQuery" placeholder="Ort oder PLZ (z.B. Hohenems)">
            <button id="btnSUP" class="active" onclick="changeFuel('SUP')">Super</button>
            <button id="btnDIE" onclick="changeFuel('DIE')">Diesel</button>
            <button onclick="search()">Suchen</button>
        </div>

        <div id="loader">Lade Preise...</div>
        <div id="stations"></div>
    </div>

    <script>
        let currentFuel = 'SUP';

        const savedCity = localStorage.getItem('sprit_saved_city') || '';
        document.getElementById('searchQuery').value = savedCity;
        if (!savedCity) {
            document.getElementById('loader').style.display = 'none';
        }

        function changeFuel(type) {
            currentFuel = type;
            document.getElementById('btnSUP').classList.toggle('active', type === 'SUP');
            document.getElementById('btnDIE').classList.toggle('active', type === 'DIE');
            search();
        }

        function search() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('stations').innerHTML = '<div>Bitte Ort oder PLZ eingeben.</div>';
                return;
            }
            localStorage.setItem('sprit_saved_city', query);

            document.getElementById('loader').style.display = 'block';
            document.getElementById('stations').innerHTML = '';

            fetch(`/api/prices?q=${encodeURIComponent(query)}&fuel=${currentFuel}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    const container = document.getElementById('stations');

                    if (data.length === 0 || data.error) {
                        container.innerHTML = '<div>Keine Stationen gefunden oder Fehler bei der Suche.</div>';
                        return;
                    }

                    data.forEach(s => {
                        const div = document.createElement('div');
                        div.className = `station${s.is_top ? ' top-winner' : ''}`;
                        const city = (s.address ? s.address.split(',').pop().trim() : '') || query;
                        const mapsQuery = encodeURIComponent(`${s.name} ${city}`.trim());
                        div.innerHTML = `
                            <div>
                                <div>${s.is_top ? '<span class="star">★</span>' : ''}${s.name}</div>
                                <div>${s.address || ''}</div>
                                <a class="maps-link" href="https://www.google.com/maps/search/?api=1&query=${mapsQuery}" target="_blank" rel="noopener noreferrer">📍 Karte</a>
                            </div>
                            <div class="price">${s.price}</div>
                        `;
                        container.appendChild(div);
                    });
                })
                .catch(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('stations').innerHTML = '<div>Fehler beim Laden der Preise.</div>';
                });
        }

        document.getElementById('searchQuery').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                search();
            }
        });

        if (savedCity) {
            search();
        }
    </script>
</body>

</html>
