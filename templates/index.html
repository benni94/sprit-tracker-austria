<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Spritpreis Tracker Hohenems</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .station {
            background: #2a2a2a;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fav {
            border: 2px solid #ffcc00;
        }

        .price {
            font-size: 1.4em;
            font-weight: bold;
            color: #00ffcc;
        }

        .fav .price {
            color: #ffcc00;
        }

        .star {
            color: #ffcc00;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Spritpreise Hohenems (Super)</h2>
        <div id="loader">Lade Preise...</div>
        <div id="stations"></div>
    </div>
    <script>
        fetch('/api/prices')
            .then(res => res.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                const container = document.getElementById('stations');
                data.forEach(s => {
                    const div = document.createElement('div');
                    div.className = `station ${s.is_fav ? 'fav' : ''}`;
                    div.innerHTML = `
                        <div>
                            <strong>${s.is_fav ? '<span class="star">★</span>' : ''}${s.name}</strong><br>
                            <small style="color:#aaa">${s.address}</small>
                        </div>
                        <div class="price">${s.price}</div>
                    `;
                    container.appendChild(div);
                });
            });
    </script>
</body>

</html>
