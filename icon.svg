<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1a1a1a" stroke="#00ffcc" stroke-width="8"/>
  
  <!-- Gas pump body -->
  <rect x="160" y="120" width="120" height="200" rx="15" fill="#2a2a2a" stroke="#444" stroke-width="4"/>
  
  <!-- Pump display -->
  <rect x="175" y="140" width="90" height="50" rx="5" fill="#1a1a1a" stroke="#00ffcc" stroke-width="2"/>
  
  <!-- Price text -->
  <text x="220" y="175" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#00ffcc" text-anchor="middle">1.50</text>
  
  <!-- Pump handle -->
  <path d="M 280 180 Q 320 180 320 220 L 320 280 Q 320 300 300 300 L 280 300" fill="none" stroke="#ffcc00" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Nozzle -->
  <rect x="268" y="288" width="24" height="40" rx="5" fill="#ffcc00"/>
  
  <!-- Hose -->
  <path d="M 280 180 Q 340 180 340 240 L 340 320 Q 340 360 300 360 L 200 360 Q 160 360 160 320 L 160 280" fill="none" stroke="#444" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Base/stand -->
  <rect x="140" y="310" width="160" height="80" rx="10" fill="#2a2a2a" stroke="#444" stroke-width="4"/>
  
  <!-- Euro symbol -->
  <text x="256" y="365" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00ffcc" text-anchor="middle">€</text>
  
  <!-- Star for top price -->
  <polygon points="380,100 390,125 415,125 395,142 402,167 380,153 358,167 365,142 345,125 370,125" fill="#ffcc00" stroke="#ffcc00" stroke-width="2"/>
</svg>
